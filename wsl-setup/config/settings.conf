#!/bin/bash
set -euo pipefail

# Base settings (mirrors ubuntu-setup)
DEFAULT_LOCALE="en_US.UTF-8"
SECONDARY_LOCALE="pl_PL.UTF-8"
OPENSEARCH_INSTALL_PATH="/opt/opensearch"
OPENSEARCH_USER="opensearch"

# WSL execution knobs
WSL_PREFER_DOCKER_DESKTOP="${WSL_PREFER_DOCKER_DESKTOP:-true}"
WSL_REQUIRE_WSL2="${WSL_REQUIRE_WSL2:-true}"
WSL_CONFIGURE_SYSTEMD="${WSL_CONFIGURE_SYSTEMD:-false}"

return 0
